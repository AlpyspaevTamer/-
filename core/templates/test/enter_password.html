<!-- templates/test/enter_password.html -->
{% extends 'base.html' %}

{% block content %}

<div class="container mx-auto px-4 py-8">
    <!-- Заголовок и кнопки управления -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-white">
  <a href="{% url 'home' %}" class="hover:text-gray-300 transition-colors duration-300">menu tap</a> &gt; Тестирование
</h1>


<div class="max-w-4xl mx-auto p-6">
    <div class="bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold mb-4">Тест: {{ test.title }}</h1>
        <form method="post">
            {% csrf_token %}
            <input 
                type="password" 
                name="password" 
                class="w-full px-4 py-2 border rounded-lg mb-4"
                placeholder="Введите пароль"
            >
            <button type="submit" class="btn-primary">Начать тест</button>
        </form>
    </div>
</div>
{% endblock %}

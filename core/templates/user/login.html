{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Вход в систему</h1>
      <p class="text-sm text-slate-500 mt-2">Введите ваши данные для авторизации</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8">
      <form method="post" class="space-y-5">
        {% csrf_token %}
        
        {% if form.errors %}
          <div class="bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100">
            Неверный логин или пароль.
          </div>
        {% endif %}

        <div>
          <label for="id_username" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Логин</label>
          <input 
            type="text" 
            name="username" 
            id="id_username" 
            required
            class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900"
          >
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label for="id_password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Пароль</label>
            <a href="{% url 'password_reset' %}" class="text-xs text-indigo-600 hover:text-indigo-700 font-medium">Забыли?</a>
          </div>
          <input 
            type="password" 
            name="password" 
            id="id_password" 
            required
            class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900"
          >
        </div>

        <button 
          type="submit" 
          class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-lg transition-colors shadow-sm mt-2"
        >
          Войти
        </button>

        <p class="text-center text-sm text-slate-600 pt-2 border-t border-slate-100 mt-4">
          Еще нет аккаунта? 
          <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Создать</a>
        </p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
